name: Bug report
description: Report a reproducible Grapharium problem without including private data
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: Please avoid attaching private graph exports
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Use the public synthetic demo if possible
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
  - type: textarea
    id: data
    attributes:
      label: Approximate graph size and quality preset
